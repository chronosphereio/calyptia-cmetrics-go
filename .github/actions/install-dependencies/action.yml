name: Install Dependencies
description: Install CFL, cmetrics, and other required dependencies

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      env:
        CMETRICS_VERSION: "2.1.2"
      run: |
        # Create temp directory for downloads
        TEMP_DIR=$(mktemp -d)

        # Install cmetrics (includes bundled CFL)
        wget -P "$TEMP_DIR" https://github.com/fluent/cmetrics/releases/download/v${CMETRICS_VERSION}/cmetrics_${CMETRICS_VERSION}_amd64-headers.deb
        wget -P "$TEMP_DIR" https://github.com/fluent/cmetrics/releases/download/v${CMETRICS_VERSION}/cmetrics_${CMETRICS_VERSION}_amd64.deb
        sudo dpkg -i "$TEMP_DIR"/cmetrics_${CMETRICS_VERSION}_amd64-headers.deb "$TEMP_DIR"/cmetrics_${CMETRICS_VERSION}_amd64.deb

        # Install mpack and xxhash from Ubuntu repos
        sudo apt-get update
        sudo apt-get install -y libmpack-dev libxxhash-dev

        # Cleanup temp directory
        rm -rf "$TEMP_DIR"
